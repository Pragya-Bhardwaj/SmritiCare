<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="login-page">

<div class="auth-wrapper auth-simple-wrapper">
  <section class="auth-panel auth-form-panel auth-simple-card" aria-label="Login form">
    <a class="auth-simple-brandline" href="/" aria-label="SmritiCare home">
      <span class="dashboard-brand-mark auth-simple-mark">
        <img class="dashboard-brand-logo" src="/favicon.ico" alt="SmritiCare logo">
      </span>
      <span class="auth-simple-brandcopy">
        <strong>SmritiCare</strong>
        <span>Calm care workspace</span>
      </span>
    </a>

    <nav class="auth-simple-nav auth-simple-nav--duo" aria-label="Authentication pages">
      <a class="auth-simple-nav-link is-active" href="/auth/login">Login</a>
      <a class="auth-simple-nav-link" href="/auth/signup">Sign Up</a>
    </nav>

    <div class="auth-simple-header">
      <h1 class="auth-title auth-simple-title">Login</h1>
      <p class="auth-subtitle auth-simple-subtitle">Access your care dashboard.</p>
    </div>

    <form onsubmit="login(event)" class="login-form">
      <div class="form-group">
        <label class="field-label" for="email">Email Address</label>
        <div class="input-field auth-dashboard-input">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 7 9 6 9-6"></path>
            </svg>
          </span>
          <input id="email" type="email" autocomplete="email" placeholder="Enter your email" required>
        </div>
        <p class="error" id="emailError"></p>
      </div>

      <div class="form-group">
        <label class="field-label" for="password">Password</label>
        <div class="input-field auth-dashboard-input">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="9" rx="2"></rect>
              <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
            </svg>
          </span>
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button
            type="button"
            class="input-suffix input-suffix-btn password-toggle"
            data-target="password"
            aria-label="Show password"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path class="eye-off-line" d="M4 20 20 4"></path>
            </svg>
          </button>
        </div>
        <p class="error" id="passwordError"></p>
      </div>

      <div class="form-meta auth-simple-meta">
        <a href="/auth/forgot-password" class="forgot-link-anchor">Forgot Password?</a>
      </div>

      <button type="submit" class="auth-btn auth-dashboard-btn login-btn" id="loginBtn">Login</button>
    </form>
  </section>
</div>

<script>
function setupPasswordToggle(toggleButton) {
  toggleButton.addEventListener("click", () => {
    const input = document.getElementById(toggleButton.dataset.target);
    const showing = input.type === "text";

    input.type = showing ? "password" : "text";
    toggleButton.classList.toggle("is-visible", !showing);
    toggleButton.setAttribute("aria-label", showing ? "Show password" : "Hide password");
  });
}

async function login(e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const emailError = document.getElementById("emailError");
  const passwordError = document.getElementById("passwordError");
  const btn = document.getElementById("loginBtn");

  emailError.innerText = "";
  passwordError.innerText = "";

  if (!email) {
    emailError.innerText = "Email is required";
    return;
  }

  if (!password) {
    passwordError.innerText = "Password is required";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Logging in...";

  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.error) {
      passwordError.innerText = data.error;
      btn.disabled = false;
      btn.innerText = "Login";
      return;
    }

    window.location.href = data.redirect;
  } catch (err) {
    passwordError.innerText = "Network error. Please try again.";
    btn.disabled = false;
    btn.innerText = "Login";
  }
}

document.querySelectorAll(".password-toggle").forEach(setupPasswordToggle);
</script>

</body>
</html>
