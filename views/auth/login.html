<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="login-page">

<div class="auth-wrapper login-wrapper">
  <div class="auth-card login-card">
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Login to continue</p>

    <form onsubmit="login(event)" class="login-form">
      <input id="email" type="email" placeholder="Email" required>
      <p class="error" id="emailError"></p>

      <input id="password" type="password" placeholder="Password" required>
      <p class="error" id="passwordError"></p>

      <button class="auth-btn login-btn" id="loginBtn">Login</button>
    </form>

    <div class="auth-link">
      <a href="/auth/forgot-password" class="forgot-link-anchor">Forgot Password?</a>
    </div>

    <div class="auth-link">
      Don't have an account?
      <a href="/auth/signup">Signup</a>
    </div>
  </div>
</div>

<script>
async function login(e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const emailError = document.getElementById("emailError");
  const passwordError = document.getElementById("passwordError");
  const btn = document.getElementById("loginBtn");

  emailError.innerText = "";
  passwordError.innerText = "";

  if (!email) {
    emailError.innerText = "Email is required";
    return;
  }

  if (!password) {
    passwordError.innerText = "Password is required";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Logging in...";

  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.error) {
      passwordError.innerText = data.error;
      btn.disabled = false;
      btn.innerText = "Login";
      return;
    }

    window.location.href = data.redirect;
  } catch (err) {
    passwordError.innerText = "Network error. Please try again.";
    btn.disabled = false;
    btn.innerText = "Login";
  }
}
</script>

</body>
</html>
