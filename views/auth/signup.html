<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="signup-page">

<div class="auth-wrapper signup-wrapper">
  <div class="auth-layout reverse">
    <section class="auth-panel auth-form-panel">
      <div class="auth-panel-inner">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join Smriti Care today</p>

        <form onsubmit="signup(event)" class="signup-form">
          <div class="form-group">
            <label class="field-label" for="name">Full Name</label>
            <div class="input-field">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="3.5"></circle>
                  <path d="M4 20c1.6-3.4 5-5 8-5s6.4 1.6 8 5"></path>
                </svg>
              </span>
              <input id="name" placeholder="Enter your full name" required>
            </div>
          </div>

          <div class="form-group">
            <label class="field-label" for="email">Email Address</label>
            <div class="input-field">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="m3 7 9 6 9-6"></path>
                </svg>
              </span>
              <input id="email" type="email" placeholder="Enter your email" required>
            </div>
          </div>

          <div class="form-group">
            <label class="field-label" for="password">Password</label>
            <div class="input-field">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>
              <input id="password" type="password" placeholder="Create a password" required>
              <span class="input-suffix" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </span>
            </div>
            <div class="strength-wrap">
              <small id="strength" class="strength">Weak</small>
              <div class="strength-bar">
                <span id="strengthBar"></span>
              </div>
            </div>
            <p class="form-helper">At least 6 characters with uppercase, numbers, and special characters.</p>
          </div>

          <div class="form-group">
            <label class="field-label" for="role">I am a</label>
            <div class="input-field select-field">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="3.5"></circle>
                  <path d="M4 20c1.6-3.4 5-5 8-5s6.4 1.6 8 5"></path>
                </svg>
              </span>
              <select id="role" required>
                <option value="">Select role</option>
                <option value="caregiver">Caregiver</option>
                <option value="patient">Patient</option>
              </select>
              <span class="input-suffix" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m6 9 6 6 6-6"></path>
                </svg>
              </span>
            </div>
          </div>

          <p class="error" id="error"></p>

          <button class="auth-btn signup-btn" id="signupBtn">Create Account</button>
        </form>

        <div class="auth-link">
          Already have an account?
          <a href="/auth/login">Sign In</a>
        </div>
      </div>
    </section>

    <section class="auth-panel auth-hero-panel">
      <div class="auth-hero-inner">
        <div class="hero-image">
          <img src="/images/signup-hero.png" alt="Smriti Care community" onerror="this.onerror=null;this.src='/images/brain.jpg';">
        </div>
        <h2 class="hero-title">Your Memory Matters</h2>
        <p class="hero-text">
          Join Smriti Care to access personalized support and resources for dementia care.
        </p>
      </div>
    </section>
  </div>
</div>

<script>
const allowedDomains = ["gmail.com", "yahoo.com", "outlook.com", "hotmail.com"];

async function signup(e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;
  const error = document.getElementById("error");
  const btn = document.getElementById("signupBtn");

  error.innerText = "";
  btn.disabled = true;
  btn.innerText = "Creating...";

  const domain = email.split("@")[1];
  if (!domain || !allowedDomains.includes(domain)) {
    error.innerText = "Invalid email domain";
    btn.disabled = false;
    btn.innerText = "Create Account";
    return;
  }

  const passwordRules = getPasswordRuleResults(password);
  checkStrength(password);

  if (!passwordRules.valid) {
    error.innerText = `Password warning: ${passwordRules.message}`;
    btn.disabled = false;
    btn.innerText = "Create Account";
    return;
  }

  if (!role) {
    error.innerText = "Please select a role";
    btn.disabled = false;
    btn.innerText = "Create Account";
    return;
  }

  try {
    const res = await fetch("/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ name, email, password, role })
    });

    const data = await res.json();

    if (data.error) {
      error.innerText = data.error;
      btn.disabled = false;
      btn.innerText = "Create Account";
      return;
    }

    window.location.href = "/auth/verify-otp";
  } catch (fetchError) {
    error.innerText = "Network error. Please try again.";
    btn.disabled = false;
    btn.innerText = "Create Account";
  }
}

/* PASSWORD STRENGTH */

function checkStrength(pwd) {
  let s = 0;
  if (pwd.length >= 6) s++;
  if (/[A-Z]/.test(pwd)) s++;
  if (/[0-9]/.test(pwd)) s++;
  if (/[@$!%*?&#]/.test(pwd)) s++;

  const txt = document.getElementById("strength");
  const bar = document.getElementById("strengthBar");

  if (s <= 1) {
    txt.innerText = "Weak";
    txt.className = "strength weak";
    bar.className = "weak";
    bar.style.width = "25%";
    return "Weak";
  }

  if (s === 2) {
    txt.innerText = "Medium";
    txt.className = "strength medium";
    bar.className = "medium";
    bar.style.width = "55%";
    return "Medium";
  }

  txt.innerText = "Strong";
  txt.className = "strength strong";
  bar.className = "strong";
  bar.style.width = "100%";
  return "Strong";
}

function getPasswordRuleResults(pwd) {
  const missing = [];

  if (pwd.length < 6) missing.push("at least 6 characters");
  if (!/[A-Z]/.test(pwd)) missing.push("one uppercase letter");
  if (!/[0-9]/.test(pwd)) missing.push("one number");
  if (!/[@$!%*?&#]/.test(pwd)) missing.push("one special character (@$!%*?&#)");

  if (!missing.length) {
    return { valid: true, message: "" };
  }

  if (missing.length === 1) {
    return { valid: false, message: `add ${missing[0]}.` };
  }

  const last = missing[missing.length - 1];
  const first = missing.slice(0, -1).join(", ");
  return { valid: false, message: `add ${first}, and ${last}.` };
}

document.getElementById("strength").innerText = "Not checked";
document.getElementById("strength").className = "strength";
document.getElementById("strengthBar").style.width = "0%";
document.getElementById("strengthBar").className = "";
</script>

</body>
</html>
