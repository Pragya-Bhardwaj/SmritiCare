<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="forgot-page">

<div class="auth-wrapper forgot-wrapper">
  <div class="auth-card forgot-card">
    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-subtitle" id="forgotSubtitle">
      Enter your registered email to receive a reset code.
    </p>

    <form id="forgotStepEmail" class="forgot-form" onsubmit="requestResetCode(event)">
      <input id="resetEmail" type="email" placeholder="Registered Email" required>
      <p class="error" id="resetEmailError"></p>
      <button class="auth-btn forgot-btn" id="sendResetBtn">Send Code</button>
    </form>

    <form id="forgotStepCode" class="forgot-form hidden" onsubmit="verifyResetCode(event)">
      <input id="resetCode" placeholder="Enter 6-digit code" required>
      <p class="error" id="resetCodeError"></p>
      <p class="auth-subtitle" id="resetTimerText" style="margin: 0 0 8px 0; font-size: 13px;"></p>
      <div class="forgot-actions">
        <button class="auth-btn forgot-btn" id="verifyResetBtn">Verify Code</button>
        <button type="button" class="auth-btn forgot-secondary-btn" id="resendResetBtn" onclick="resendResetCode()">
          Resend Code
        </button>
      </div>
    </form>

    <p class="success" id="resetSuccess"></p>

    <div class="auth-link">
      <a href="/auth/login">Back to Login</a>
    </div>
  </div>
</div>

<script>
const forgotSubtitle = document.getElementById("forgotSubtitle");
const forgotStepEmail = document.getElementById("forgotStepEmail");
const forgotStepCode = document.getElementById("forgotStepCode");
const forgotSteps = [forgotStepEmail, forgotStepCode];
const sendResetBtn = document.getElementById("sendResetBtn");
const resendResetBtn = document.getElementById("resendResetBtn");
const resetTimerText = document.getElementById("resetTimerText");

const AUTO_RESEND_SECONDS = 60;
let autoResendSecondsLeft = AUTO_RESEND_SECONDS;
let autoResendTimerRef = null;
let hasSentInitialResetCode = false;
let isResendInFlight = false;

function formatCountdown(seconds) {
  const mins = String(Math.floor(seconds / 60)).padStart(2, "0");
  const secs = String(seconds % 60).padStart(2, "0");
  return `${mins}:${secs}`;
}

function setSendCodeLocked(locked) {
  sendResetBtn.disabled = locked;
  sendResetBtn.innerText = locked ? "Code Sent" : "Send Code";
}

function updateTimerUi() {
  if (autoResendSecondsLeft > 0) {
    const formatted = formatCountdown(autoResendSecondsLeft);
    resetTimerText.innerText = `Auto resend in ${formatted}`;
    resendResetBtn.disabled = true;
    resendResetBtn.innerText = `Resend in ${formatted}`;
    return;
  }

  resetTimerText.innerText = "Resending code...";
  resendResetBtn.disabled = true;
  resendResetBtn.innerText = "Resending...";
}

function stopAutoResendTimer() {
  if (autoResendTimerRef) {
    clearInterval(autoResendTimerRef);
    autoResendTimerRef = null;
  }
}

function startAutoResendTimer() {
  stopAutoResendTimer();
  autoResendSecondsLeft = AUTO_RESEND_SECONDS;
  updateTimerUi();

  autoResendTimerRef = setInterval(async () => {
    autoResendSecondsLeft -= 1;

    if (autoResendSecondsLeft > 0) {
      updateTimerUi();
      return;
    }

    stopAutoResendTimer();
    updateTimerUi();
    await resendResetCode({ auto: true });
  }, 1000);
}

function animateForgotStep(stepEl) {
  stepEl.classList.remove("step-slide-up");
  void stepEl.offsetWidth;
  stepEl.classList.add("step-slide-up");
}

function setForgotStep(step) {
  forgotSteps.forEach((formEl) => {
    formEl.classList.add("hidden");
    formEl.classList.remove("step-slide-up");
  });

  let activeStep = forgotStepEmail;
  if (step === "code") {
    activeStep = forgotStepCode;
    forgotSubtitle.innerText = "Enter the 6-digit code sent to your email.";
  } else {
    forgotSubtitle.innerText = "Enter your registered email to receive a reset code.";
  }

  activeStep.classList.remove("hidden");
  animateForgotStep(activeStep);
}

function clearForgotMessages() {
  document.getElementById("resetEmailError").innerText = "";
  document.getElementById("resetCodeError").innerText = "";
  document.getElementById("resetSuccess").innerText = "";
}

async function requestResetCode(e) {
  e.preventDefault();

  const email = document.getElementById("resetEmail").value.trim();
  const err = document.getElementById("resetEmailError");

  clearForgotMessages();

  if (hasSentInitialResetCode) {
    err.innerText = "Reset code is already sent. Please verify the code below.";
    return;
  }

  if (!email) {
    err.innerText = "Email is required";
    return;
  }

  sendResetBtn.disabled = true;
  sendResetBtn.innerText = "Sending...";

  try {
    const res = await fetch("/auth/forgot-password/request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email })
    });

    const data = await res.json();
    if (!res.ok) {
      err.innerText = data.error || "Failed to send reset code";
      sendResetBtn.disabled = false;
      sendResetBtn.innerText = "Send Code";
      return;
    }

    hasSentInitialResetCode = true;
    setSendCodeLocked(true);
    document.getElementById("resetSuccess").innerText = data.message || "Reset code sent.";
    setForgotStep("code");
    startAutoResendTimer();
  } catch (error) {
    err.innerText = "Network error. Please try again.";
    sendResetBtn.disabled = false;
    sendResetBtn.innerText = "Send Code";
  }
}

async function verifyResetCode(e) {
  e.preventDefault();

  const code = document.getElementById("resetCode").value.trim();
  const err = document.getElementById("resetCodeError");
  const btn = document.getElementById("verifyResetBtn");

  clearForgotMessages();

  if (!code) {
    err.innerText = "Reset code is required";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Verifying...";

  try {
    const res = await fetch("/auth/forgot-password/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ code })
    });

    const data = await res.json();
    if (!res.ok) {
      err.innerText = data.error || "Invalid reset code";
      btn.disabled = false;
      btn.innerText = "Verify Code";
      return;
    }

    document.getElementById("resetSuccess").innerText = data.message || "Code verified.";
    window.location.href = data.redirect || "/auth/forgot-password/new-password";
  } catch (error) {
    err.innerText = "Network error. Please try again.";
    btn.disabled = false;
    btn.innerText = "Verify Code";
  }
}

async function resendResetCode(options = {}) {
  if (isResendInFlight) return;

  const { auto = false } = options;
  const err = document.getElementById("resetCodeError");

  clearForgotMessages();

  isResendInFlight = true;
  resendResetBtn.disabled = true;
  resendResetBtn.innerText = "Resending...";
  resetTimerText.innerText = auto ? "Auto-resending code..." : "Resending code...";

  try {
    const res = await fetch("/auth/forgot-password/resend", {
      method: "POST",
      credentials: "include"
    });

    const data = await res.json();
    if (!res.ok) {
      err.innerText = data.error || "Failed to resend reset code";
      resendResetBtn.disabled = false;
      resendResetBtn.innerText = "Resend Code";
      resetTimerText.innerText = "Auto resend failed. You can resend manually.";
      return;
    }

    document.getElementById("resetSuccess").innerText = data.message || "New reset code sent.";
    startAutoResendTimer();
  } catch (error) {
    err.innerText = "Network error. Please try again.";
    resendResetBtn.disabled = false;
    resendResetBtn.innerText = "Resend Code";
    resetTimerText.innerText = "Auto resend failed. You can resend manually.";
  } finally {
    isResendInFlight = false;
  }
}

window.addEventListener("beforeunload", stopAutoResendTimer);
setForgotStep("email");
</script>

</body>
</html>
