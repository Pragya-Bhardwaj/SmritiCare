<!DOCTYPE html>
<html>
<head>
  <title>Set New Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="forgot-page reset-page">

<div class="auth-wrapper forgot-wrapper">
  <div class="auth-layout">
    <section class="auth-panel auth-form-panel">
      <div class="auth-panel-inner">
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">
          Your code is verified. Create a new password to continue.
        </p>

        <form class="forgot-form" id="resetPasswordForm" onsubmit="updatePassword(event)">
          <div class="form-group">
            <label class="field-label" for="newPassword">New Password</label>
            <div class="input-field">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>
              <input id="newPassword" type="password" placeholder="Create a new password" required>
              <button
                type="button"
                class="input-suffix input-suffix-btn password-toggle"
                data-target="newPassword"
                aria-label="Show password"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                  <path class="eye-off-line" d="M4 20 20 4"></path>
                </svg>
              </button>
            </div>
            <div class="strength-wrap forgot-strength-wrap">
              <small id="forgotStrength" class="strength">Not checked</small>
              <div class="strength-bar">
                <span id="forgotStrengthBar"></span>
              </div>
            </div>
            <p class="warning" id="reusePasswordWarning"></p>
          </div>

          <div class="form-group">
            <label class="field-label" for="confirmPassword">Confirm New Password</label>
            <div class="input-field">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>
              <input id="confirmPassword" type="password" placeholder="Confirm new password" required>
              <button
                type="button"
                class="input-suffix input-suffix-btn password-toggle"
                data-target="confirmPassword"
                aria-label="Show password"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                  <path class="eye-off-line" d="M4 20 20 4"></path>
                </svg>
              </button>
            </div>
            <p class="error" id="resetPasswordError"></p>
          </div>

          <button class="auth-btn forgot-btn" id="resetPasswordBtn">Reset Password</button>
        </form>

        <p class="success" id="resetSuccess"></p>

        <div class="auth-link">
          <a href="/auth/login">Back to Login</a>
        </div>
      </div>
    </section>

    <section class="auth-panel auth-hero-panel">
      <div class="auth-hero-inner">
        <div class="hero-image logo-hero">
          <img src="/images/email-logo.png" alt="SmritiCare logo">
        </div>
        <h2 class="hero-title">Fresh Start</h2>
        <p class="hero-text">
          Create a secure password to keep your Smriti Care account protected.
        </p>
      </div>
    </section>
  </div>
</div>

<script>
function clearMessages() {
  document.getElementById("resetPasswordError").innerText = "";
  document.getElementById("resetSuccess").innerText = "";
  document.getElementById("reusePasswordWarning").innerText = "";
}

function getPasswordRuleResults(password) {
  const checks = [
    { ok: password.length >= 6, label: "at least 6 characters" },
    { ok: /[A-Z]/.test(password), label: "one uppercase letter" },
    { ok: /[0-9]/.test(password), label: "one number" },
    { ok: /[@$!%*?&#]/.test(password), label: "one special character (@$!%*?&#)" }
  ];

  const missing = checks.filter((c) => !c.ok).map((c) => c.label);
  return { valid: missing.length === 0, missing, score: checks.length - missing.length };
}

function updatePasswordStrength(password) {
  const { score } = getPasswordRuleResults(password);
  const txt = document.getElementById("forgotStrength");
  const bar = document.getElementById("forgotStrengthBar");

  if (!password) {
    txt.innerText = "Not checked";
    txt.className = "strength";
    bar.className = "";
    bar.style.width = "0%";
    return;
  }

  if (score <= 1) {
    txt.innerText = "Weak";
    txt.className = "strength weak";
    bar.className = "weak";
    bar.style.width = "25%";
    return;
  }

  if (score <= 3) {
    txt.innerText = "Medium";
    txt.className = "strength medium";
    bar.className = "medium";
    bar.style.width = "60%";
    return;
  }

  txt.innerText = "Strong";
  txt.className = "strength strong";
  bar.className = "strong";
  bar.style.width = "100%";
}

function getPasswordWarningMessage(missing) {
  if (!missing.length) return "";
  if (missing.length === 1) return `Add ${missing[0]}.`;
  const last = missing[missing.length - 1];
  const first = missing.slice(0, -1).join(", ");
  return `Add ${first}, and ${last}.`;
}

function setupPasswordToggle(toggleButton) {
  toggleButton.addEventListener("click", () => {
    const input = document.getElementById(toggleButton.dataset.target);
    const showing = input.type === "text";

    input.type = showing ? "password" : "text";
    toggleButton.classList.toggle("is-visible", !showing);
    toggleButton.setAttribute("aria-label", showing ? "Show password" : "Hide password");
  });
}

async function updatePassword(e) {
  e.preventDefault();

  const password = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const err = document.getElementById("resetPasswordError");
  const btn = document.getElementById("resetPasswordBtn");
  const warning = document.getElementById("reusePasswordWarning");

  clearMessages();

  if (password !== confirmPassword) {
    err.innerText = "Passwords do not match";
    return;
  }

  const validationResult = getPasswordRuleResults(password);
  updatePasswordStrength(password);

  if (!validationResult.valid) {
    err.innerText = `Password warning: ${getPasswordWarningMessage(validationResult.missing)}`;
    return;
  }

  btn.disabled = true;
  btn.innerText = "Resetting...";

  try {
    const res = await fetch("/auth/forgot-password/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ password })
    });

    const data = await res.json();
    if (!res.ok) {
      if (data.error && data.error.includes("different from the current password")) {
        warning.innerText = data.error;
      } else {
        err.innerText = data.error || "Failed to reset password";
      }
      btn.disabled = false;
      btn.innerText = "Reset Password";
      return;
    }

    document.getElementById("resetSuccess").innerText = data.message || "Password reset successful.";
    setTimeout(() => {
      window.location.href = "/auth/login";
    }, 1200);
  } catch (error) {
    err.innerText = "Network error. Please try again.";
    btn.disabled = false;
    btn.innerText = "Reset Password";
  }
}

document.getElementById("newPassword").addEventListener("input", (e) => {
  updatePasswordStrength(e.target.value);
});

document.querySelectorAll(".password-toggle").forEach(setupPasswordToggle);
updatePasswordStrength("");
</script>

</body>
</html>
