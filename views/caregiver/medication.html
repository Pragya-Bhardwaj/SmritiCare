<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medications - SmritiCare</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/caregiver.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">SmritiCare</h2>

    <nav>
      <a href="/caregiver/dashboard">Dashboard</a>
      <a href="/caregiver/memory">Memory Board</a>
      <a href="/caregiver/reminders">Reminders</a>
      <a href="/caregiver/medication">Medications</a>
      <a href="/caregiver/location">Live Location</a>
      <a href="/caregiver/selfcare">Self Care</a>
      <a href="/caregiver/profile">Profile</a>
      <a href="/auth/logout" class="logout-btn">Logout</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="page-header">
      <div>
        <h1>Medications</h1>
        <p class="small">Track medicines and dosage schedules</p>
      </div>

      <button class="primary-btn" onclick="openAddModal()">+ Add Medication</button>
    </div>

    <section class="card-list" id="medicationList">
      <div class="card" style="text-align: center; padding: 40px; color: #999;">
        <p>Loading medications...</p>
      </div>
    </section>
  </main>
</div>

<!-- ADD / EDIT MODAL -->
<div class="modal hidden" id="medModal">
  <div class="modal-box">
    <h3 id="modalTitle">Add Medication</h3>

    <input type="text" id="medName" placeholder="Medication name">

    <div class="time-select">
      <select id="medHour">
        <option>01</option>
        <option>02</option>
        <option>03</option>
        <option>04</option>
        <option>05</option>
        <option>06</option>
        <option>07</option>
        <option>08</option>
        <option>09</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
      </select>

      <select id="medMinute">
        <option>00</option>
        <option>15</option>
        <option>30</option>
        <option>45</option>
      </select>

      <select id="medAmPm">
        <option>AM</option>
        <option>PM</option>
      </select>
    </div>

    <input type="text" id="medDose" placeholder="Dosage (e.g., 500 mg)">
    <textarea id="medNotes" placeholder="Notes (optional)"></textarea>

    <div class="modal-actions">
      <button class="secondary-btn" onclick="closeMedModal()">Cancel</button>
      <button class="primary-btn" onclick="saveMedication()">Save</button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal hidden" id="deleteModal">
  <div class="modal-box">
    <h3>Delete Medication?</h3>
    <p class="small">This cannot be undone.</p>

    <div class="modal-actions">
      <button class="secondary-btn" onclick="closeDeleteModal()">Cancel</button>
      <button class="primary-btn" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script src="/js/profileStatusChecker.js"></script>
<script src="/js/caregiverDashboard.js"></script>
<script src="/js/caregiverMedication.js"></script>
</body>
</html>
