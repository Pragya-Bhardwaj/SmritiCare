<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caregiver Dashboard - SmritiCare</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/caregiver.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">SmritiCare</div>

    <nav>
      <a href="/caregiver/dashboard">Dashboard</a>
      <a href="/caregiver/memory">Memory Board</a>
      <a href="/caregiver/reminders">Reminders</a>
      <a href="/caregiver/medication">Medications</a>
      <a href="/caregiver/location">Live Location</a>
      <a href="/caregiver/selfcare">Self Care</a>
      <a href="/caregiver/profile">Profile</a>
      <a href="/auth/logout" class="logout-btn">Logout</a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <header class="topbar">
      <div class="user">
        <div>
          <strong>Caregiver</strong>
          <p id="caregiverName">Loading...</p>
        </div>
      </div>
      <div class="date-display">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <path d="M16 2v4M8 2v4M3 10h18"></path>
        </svg>
        <span id="dashboardDate">Loading date...</span>
      </div>
    </header>

    <section class="welcome">
      <div>
        <p class="small">Welcome</p>
        <h1>You are doing a wonderful job.</h1>
        <p class="sub"><span class="inline-heart">♥</span>One step at a time.</p>
        <button id="unsyncCalendarBtn" class="unsync-btn" style="margin-top: 1em;">Unsync Google Calendar</button>
        <span id="unsyncStatus" style="display:none;margin-left:1em;color:green;"></span>
      </div>
    </section>

    <section class="card quote-card">
      “Remember to take care of yourself. Your well-being matters just as much as those you care for.”
    </section>

  </main>
</div>

<script src="/js/profileStatusChecker.js"></script>
<script src="/js/caregiverDashboard.js"></script>
</body>
</html>
