<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminders - SmritiCare</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/patient.css">
  <link rel="stylesheet" href="/css/reminder.css">
  <style>
    .gcal-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 20px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .gcal-banner .gcal-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gcal-banner .gcal-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }
    .gcal-banner .gcal-text strong {
      display: block;
      font-size: 14px;
      color: #1e293b;
    }
    .gcal-banner .gcal-text span {
      font-size: 12px;
      color: #64748b;
    }
    .gcal-connect-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      color: #374151;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .gcal-connect-btn:hover {
      background: #f8fafc;
      border-color: #4285F4;
      color: #4285F4;
    }
    .gcal-connected-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0fdf4;
      color: #16a34a;
      border: 1.5px solid #bbf7d0;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .gcal-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .gcal-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .gcal-toast.success { border-left: 4px solid #22c55e; }
    .gcal-toast.error   { border-left: 4px solid #ef4444; }
  </style>
</head>

<body>

  <div class="dashboard">

    <!-- SIDEBAR -->
      <aside class="sidebar">
    <div class="sidebar-logo">SmritiCare</div>
    <nav>
      <a href="/patient/dashboard">Dashboard</a>
      <a href="/patient/memory">Memory Board</a>
      <a href="/patient/reminders">Reminders</a>
      <a href="/patient/medication">Medication</a>
      <a href="/patient/selfcare">Self Care</a>
      <a href="/patient/profile">Profile</a>
      <a href="/auth/logout" class="logout-btn">Logout</a>
    </nav>
  </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

      <!-- GOOGLE CALENDAR BANNER -->
      <div class="gcal-banner" id="gcalBanner">
        <div class="gcal-info">
          <!-- Google Calendar SVG icon -->
          <svg class="gcal-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="10" width="36" height="34" rx="3" fill="#fff" stroke="#dadce0" stroke-width="2"/>
            <rect x="6" y="10" width="36" height="10" rx="3" fill="#4285F4"/>
            <rect x="6" y="16" width="36" height="4" fill="#4285F4"/>
            <line x1="16" y1="10" x2="16" y2="6" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="32" y1="10" x2="32" y2="6" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round"/>
            <text x="24" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#4285F4" font-family="Arial">24</text>
          </svg>
          <div class="gcal-text">
            <strong>Google Calendar Sync</strong>
            <span id="gcalStatusText">Connect to auto-sync reminders to your Google Calendar</span>
          </div>
        </div>
        <div id="gcalAction">
          <span style="font-size:13px; color:#94a3b8;">Checking...</span>
        </div>
      </div>

      <h1>Your Reminders</h1>
      <p class="sub" style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Your scheduled reminders at a glance.</p>


      <!-- SYNC BUTTON -->
      <!-- Sync Calendar button removed -->

      <!-- CATEGORY FILTER TABS -->
      <div class="filter-tabs">
        <button class="tab active">All</button>
        <button class="tab">Medicine</button>
        <button class="tab">Meal</button>
        <button class="tab">Appointment</button>
        <button class="tab">Hygiene</button>
        <button class="tab">Other</button>
      </div>

      <!-- REMINDERS LIST (segregated by category) -->
      <div class="reminders-list" id="remindersList">
        <!-- Reminders will be loaded here via JavaScript -->
        <div class="card" style="text-align: center; padding: 40px; color: #999;">
          <p>Loading reminders...</p>
        </div>
      </div>

    </main>

  </div>


 <!-- IMPORTANT: Load location tracking on ALL patient pages -->
<script src="/js/patientLocationSharing.js"></script>
<script src="/js/profileStatusChecker.js"></script>
<script src="/js/patientApp.js"></script>
<script src="/js/patientReminders.js"></script>
</body>

</html>
