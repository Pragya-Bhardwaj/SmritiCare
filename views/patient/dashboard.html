<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Dashboard - SmritiCare</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/patient.css">
  <link rel="stylesheet" href="/css/memoryBoard.css">
  <link rel="icon" href="/favicon.png">
</head>
<body>

<div class="dashboard patient-dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">SmritiCare</div>
    <nav>
      <a href="/patient/dashboard">Dashboard</a>
      <a href="/patient/memory">Memory Board</a>
      <a href="/patient/reminders">Reminders</a>
      <a href="/patient/medication">Medication</a>
      <a href="/patient/selfcare">Self Care</a>
      <a href="/patient/profile">Profile</a>
      <a href="/auth/logout" class="logout-btn">Logout</a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main patient-dashboard-main">

    <header class="topbar patient-topbar">
      <div class="user">
        <div>
          <strong>Patient</strong>
          <p id="patientName">Loading...</p>
        </div>
      </div>

      <div class="patient-topbar-actions">
        <div class="date-display">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <path d="M16 2v4M8 2v4M3 10h18"></path>
          </svg>
          <span id="dashboardDate">Loading date...</span>
        </div>
      </div>
    </header>

    <section class="welcome patient-welcome">
      <div class="patient-welcome-copy">
        <p class="small patient-welcome-kicker">Your calm space for today</p>
        <h1>We're here to help you feel steady and supported.</h1>
      </div>
    </section>

    <div class="patient-content-grid">
      <div class="patient-main-stack">
        <div id="dashboardReminderMount" class="dashboard-slot" aria-live="polite"></div>

        <section class="patient-section-head">
          <div class="patient-section-copy">
            <p class="patient-card-kicker">Memory support</p>
            <h2 class="section-title">Recent Memories</h2>
          </div>
        </section>

        <div id="memoryGrid" class="memory-grid dashboard-memory-grid" aria-live="polite"></div>
      </div>

    </div>

  </main>

</div>

<!-- IMPORTANT: Load location tracking on ALL patient pages -->
<script src="/js/patientLocationSharing.js"></script>
<script src="/js/profileStatusChecker.js"></script>
<script src="/js/patientApp.js"></script>
<script src="/js/patientDashboard.js"></script>
<script src="/js/patientDashboardReminders.js"></script>
</body>
</html>
