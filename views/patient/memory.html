<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/patient.css">

<body>

<div class="dashboard">

    <aside class="sidebar">

</div>
